# Desk Mascot config. Restart mascotd after editing.

[general]
port = 7788
default_dir = "~"                       # where a new Claude session starts
terminal = "auto"                        # "auto" (Warp if installed), "warp" or "terminal" (Terminal.app)
show_in_dock = true                      # robot icon in the Dock; false = only the window on screen

[hotkeys]
# Combos use pynput names: <ctrl>, <alt>, <cmd>, <shift>, letters, <f17>...
new_session = ["<ctrl>+<alt>+n", "<f18>"]
voice_toggle = ["<ctrl>+<alt>+v", "<f17>"]
# Hold-to-talk keys. A key that is held alone; any other key pressed meanwhile cancels.
push_to_talk = ["left_option", "f19"]   # left_option | right_option | any pynput key name

[stt]
model = "models/ggml-large-v3-turbo-q5_0.bin"
language = "auto"          # a fixed language is ~2x faster than "auto" and keeps English terms inside other speech
# Dictation languages in the settings panel: whisper code = label. Add any of whisper's ~100 codes, e.g. uk = "Ukrainian".
languages = { auto = "auto-detect", en = "English", es = "Spanish", fr = "French", de = "German", pt = "Portuguese", it = "Italian", zh = "Chinese", ja = "Japanese", hi = "Hindi", ar = "Arabic" }
server_port = 7789
min_seconds = 0.4
auto_enter = false         # press Return after pasting

[voice]
enabled = true             # spoken replies on start; toggle with the voice hotkey
voice = ""                 # any name from `say -v ?`; "" = system voice from Spoken Content (Siri voices live only there)
# voice_ru = ""            # optional second voice for replies in Cyrillic; adds a "Russian voice" row to the panel
max_chars = 200
scope = "all"              # "all" sessions, or "last" = only the session you last prompted
